plugins { id 'com.android.application' }
android {
    namespace 'com.racinglearnfun.app'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.racinglearnfun.app'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            if (System.getenv('RACING_KEYSTORE')) {
                storeFile file(System.getenv('RACING_KEYSTORE'))
                storePassword System.getenv('RACING_STORE_PASSWORD')
                keyAlias System.getenv('RACING_KEY_ALIAS')
                keyPassword System.getenv('RACING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('RACING_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}
