name: Verify game and build Android
on:
  push:
    branches: [main]
    paths-ignore: ['apk/**', 'aab/**', 'release/**', 'docs/**', 'store-assets/**', 'README.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build && git diff --exit-code -- index.html android/app/src/main/assets/index.html
      - name: Test gameplay offline
        run: CHROMIUM_BIN=$(command -v google-chrome) npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and lint
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:lintRelease
      - name: Verify and package test artifacts
        run: ANDROID_SDK_ROOT="$ANDROID_HOME" bash scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Racing-Learn-Fun-v1.0.0
          path: |
            apk/
            aab/
            release/
            outputs/
            android/app/build/reports/lint-results-release.html
          if-no-files-found: error
